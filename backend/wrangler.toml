# UWAGA: ten worker NIE jest juz produkcja.
#
# Do sierpnia 2026 stala tu nazwa identyczna jak w repozytorium VerifAI, ktore
# ma nowsza wersje (812 linii wobec 264 tutaj: trasa /feed oraz tryby "story"
# i "lingo"). Oba wdrazaly sie pod ten sam adres fact-checker.criticai.workers.dev,
# wiec `wrangler deploy` odpalony w TYM folderze nadpisywal produkcje i kladl
# naraz VerfAI PWA oraz cale Linglerno.
#
# Nazwa jest inna, zeby to bylo niemozliwe. Produkcje utrzymuj w VerifAI.
name = "fact-checker-legacy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Publiczny adres workers.dev – tak wtyczka i PWA wołają backend.
workers_dev = true
# Adresy podglądowe (jeden na wersję) też serwowałyby zapytania na Twoim kluczu
# i omijały limity liczone dla głównego adresu. Zbędna furtka – wyłączone.
preview_urls = false

# Domyślny model (możesz nadpisać). Klucz API ustaw jako SECRET, nie tutaj:
#   npx wrangler secret put GEMINI_API_KEY
[vars]
GEMINI_MODEL = "gemini-3.1-flash-lite"
# Grounding (weryfikacja w realnych źródłach Google) dla fact-checku. Domyślnie ON.
# Ustaw "off", jeśli chcesz szybciej/taniej, bez wyszukiwania w sieci.
GROUNDING = "on"

# Limity zapytań (ochrona Twojego klucza) – 12/min i 200/dobę na urządzenie.
# Namespace utworzony przez: npx wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "ce1bbad6dba54fa492ad4e4d7e3e8e57"
