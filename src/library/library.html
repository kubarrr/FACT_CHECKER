<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteka – Fact Checker AI</title>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero" id="hero">
        <div class="hero-top">
          <span class="hero-flag" id="heroFlag">📚</span>
          <div class="hero-titles">
            <div class="hero-level" id="heroLevel">Ziarno</div>
            <div class="hero-sub" id="heroSub">Twoja biblioteka nauki</div>
          </div>
          <div class="hero-streak" id="heroStreak">🔥 0</div>
        </div>
        <div class="xpbar"><i id="xpFill" style="width: 0%"></i></div>
        <div class="xpmeta">
          <span id="xpNow">0 XP</span>
          <span id="xpNext"></span>
        </div>
      </header>

      <div class="stats" id="stats"></div>
      <div class="badges" id="badges"></div>

      <!-- Etykiety zakładek wstawia applyStaticLabels() wg języka aplikacji. -->
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="review" aria-selected="true">
          <span class="pill" id="duePill" hidden>0</span>
        </button>
        <button class="tab" role="tab" data-tab="vocab" aria-selected="false"></button>
        <button class="tab" role="tab" data-tab="career" aria-selected="false"></button>
        <button class="tab" role="tab" data-tab="history" aria-selected="false"></button>
        <button class="tab" role="tab" data-tab="profile" aria-selected="false"></button>
      </div>

      <section class="panel" id="panel-review" role="tabpanel"></section>
      <section class="panel" id="panel-vocab" role="tabpanel" hidden></section>
      <section class="panel" id="panel-career" role="tabpanel" hidden></section>
      <section class="panel" id="panel-history" role="tabpanel" hidden></section>
      <section class="panel" id="panel-profile" role="tabpanel" hidden></section>
    </div>

    <footer class="footer">
      <span id="footerNote"></span>
      <span class="spacer" style="flex: 1"></span>
      <button class="btn" id="exportBtn"></button>
      <button class="btn" id="settingsBtn"></button>
    </footer>

    <div class="toasts" id="toasts"></div>

    <script src="../shared/catalog.js"></script>
    <script src="../shared/strings.js"></script>
    <script src="../shared/store.js"></script>
    <script src="../shared/esco.js"></script>
    <script src="library.js"></script>
  </body>
</html>
